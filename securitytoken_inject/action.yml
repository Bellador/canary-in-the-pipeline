name: 'Securitytoken inject'
description: 'Injects an AWS decoy credentials into the runner''s process environment (via $GITHUB_ENV) and writes them to disk at ~/.aws/credentials. Any credential-harvesting tool that validates these tokens will trigger a SOC alert'
author: 'https://github.com/Bellador'

inputs:
  auth_token:
    description: 'API authentication token - organizational GitHub secret which will be supplied as parameter by the workflow calling this composite action'
    required: true

  canary_domain:
    description: 'Securitytoken console domain'
    required: false
    default: '<ENTER CLOUD CONSOLE DOMAIN>' # CHANGE HERE! e.g. d3adb33f.canary.tools

  expiry:
    description: 'Token lifetime accepted by the API. The higher the run cadence of a workflow, the lower should be the expiry to not surpass the creation threshold. Rule of thumb to set the expiry value based on workflow runs; multiple-times per day: 1day; multiple-times per week: 7days; multiple-times per month: 14days (default)'
    required: false
    default: '14d'

  memo_extra:
    description: 'Optional free-text appended to the auto-generated memo so one can add environment, team, or service identifiers'
    required: false
    default: ''

  write_to_disk:
    description: 'Write the securitytoken to an AWS decoy credentials file on disk. Exposes the securitytoken to file-system scrapers in addition to env-var harvesters. Set to true for non-persistent, ephemeral runners'
    required: false
    default: 'false'

  aws_profile:
    description: 'AWS decoy credentials profile name written to the file. Should not be the default to not interfere with any existing AWS creds'
    required: false
    default: 'snowcrash'

outputs:
  aws_access_key_id:
    description: 'The decoy AWS Access Key ID that was injected.'
    value: ${{ steps.create-token.outputs.aws_access_key_id }}

  canarytoken_id:
    description: 'The securitytoken ID (useful for audit logs).'
    value: ${{ steps.create-token.outputs.canarytoken_id }}

  injection_status:
    description: 'success or failed - indicates whether the securitytoken was successfully created and injected.'
    value: ${{ steps.create-token.outputs.injection_status }}

  disk_write_status:
    description: 'success or failed - indicates whether the securitytoken was successfully written to disk. Empty if write_to_disk was false or injection itself failed.'
    value: ${{ steps.disk-write.outputs.disk_write_status }}

runs:
  using: composite
  steps:

    # ── 1. Create the securitytoken via the API ─────────────────────────────────
    - name: Securitytoken create
      id: create-token
      shell: bash
      env:
        AUTH_TOKEN: ${{ inputs.auth_token }}
        CANARY_DOMAIN: ${{ inputs.canary_domain }}
        EXPIRY: ${{ inputs.expiry }}
        MEMO_EXTRA: ${{ inputs.memo_extra }}
        GH_RUN_ID: ${{ github.run_id }}
        GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        GH_ACTOR: ${{ github.actor }}
        GH_ACTOR_ID: ${{ github.actor_id }}
        GH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        GH_REPOSITORY: ${{ github.repository }}
        GH_REF_NAME: ${{ github.ref_name }}
        GH_SHA: ${{ github.sha }}
        GH_WORKFLOW: ${{ github.workflow }}
        GH_WORKFLOW_REF: ${{ github.workflow_ref }}
        GH_JOB: ${{ github.job }}
        GH_RUN_NUMBER: ${{ github.run_number }}
        GH_EVENT_NAME: ${{ github.event_name }}
        GH_RUNNER_OS: ${{ runner.os }}
        GH_RUNNER_NAME: ${{ runner.name }}
        GH_SERVER_URL: ${{ github.server_url }}

      run: |
        set -euo pipefail

        echo "injection_status=failed" >> "$GITHUB_OUTPUT"
        
        # ── Dependency check ───────────────────────────────────────────────────
        for c in curl jq grep awk mkdir chmod; do
          command -v "$c" >/dev/null 2>&1 || {
            echo "::error::Securitytoken inject requires '$c', which is not available on this runner/container. Requires bash, curl, jq, grep, awk, mkdir, chmod. See README#requirements."
            echo "injection_status=failed" >> "$GITHUB_OUTPUT"
            exit 0
          }
        done

        # ── Build memo to uniquely attribute token ───────────────────────────
        MEMO="run=${GH_RUN_ID},run_attempt=${GH_RUN_ATTEMPT}"
        MEMO="${MEMO},actor=${GH_ACTOR},actorid=${GH_ACTOR_ID}"
        MEMO="${MEMO},triggering_actor=${GH_TRIGGERING_ACTOR}"
        MEMO="${MEMO},repo=${GH_REPOSITORY},ref=${GH_REF_NAME}"
        MEMO="${MEMO},sha=${GH_SHA}"
        MEMO="${MEMO},workflow=${GH_WORKFLOW},workflow_ref=${GH_WORKFLOW_REF}"
        MEMO="${MEMO},job=${GH_JOB},run_number=${GH_RUN_NUMBER}"
        MEMO="${MEMO},event=${GH_EVENT_NAME}"
        MEMO="${MEMO},runner_os=${GH_RUNNER_OS},runner_name=${GH_RUNNER_NAME}"
        MEMO="${MEMO},run_url=${GH_SERVER_URL}/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}/attempts/${GH_RUN_ATTEMPT}"
        [ -n "$MEMO_EXTRA" ] && MEMO="${MEMO},${MEMO_EXTRA}"

        echo "::debug::Memo: $MEMO"

        # ── Call API ────────────────────────────────────────────────────────────
        RESPONSE=$(curl -sS \
          --max-time 15 \
          --retry 3 \
          --retry-delay 2 \
          "https://${CANARY_DOMAIN}/api/v1/canarytoken/create" \
          -d auth_token="${AUTH_TOKEN}" \
          -d memo="${MEMO}" \
          -d expiry="${EXPIRY}" \
          -d kind=aws-id) || {
            echo "::warning::Securitytoken API request failed (curl exit code $?; check https://everything.curl.dev/cmdline/exitcode.html )"
            echo "injection_status=failed" >> "$GITHUB_OUTPUT"
            exit 0
          }

        # ── Validate response ───────────────────────────────────────────────────
        if ! echo "$RESPONSE" | jq -e '.canarytoken.renders."aws-id"' > /dev/null 2>&1; then
          echo "::warning::Unexpected API response: $(echo "$RESPONSE" | head -c 500)"
          echo "injection_status=failed" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # ── Parse credentials ───────────────────────────────────────────────────
        RENDERS=$(echo "$RESPONSE" | jq -r '.canarytoken.renders."aws-id"')
        TOKEN_ID=$(echo "$RESPONSE" | jq -r '.canarytoken.canarytoken')

        AWS_KEY_ID=$(printf '%s' "$RENDERS" \
          | grep -oE 'aws_access_key_id = .{20}' \
          | awk '{print $3}') || true

        AWS_SECRET=$(printf '%s' "$RENDERS" \
          | grep -oE 'aws_secret_access_key = .{40}' \
          | awk '{print $3}') || true

        if [ -z "$AWS_KEY_ID" ] || [ -z "$AWS_SECRET" ]; then
          echo "::warning::Could not parse credentials from API response."
          echo "injection_status=failed" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # ── Inject into process environment (all subsequent steps see these) ────
        echo "AWS_ACCESS_KEY_ID=${AWS_KEY_ID}"         >> "$GITHUB_ENV"
        echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET}"     >> "$GITHUB_ENV"
        echo "AWS_DEFAULT_REGION=eu-central-2"         >> "$GITHUB_ENV"

        # ── Expose outputs (masked in logs) ─────────────────────────────────────
        echo "::add-mask::${AWS_KEY_ID}"
        echo "::add-mask::${AWS_SECRET}"
        echo "aws_access_key_id=${AWS_KEY_ID}"  >> "$GITHUB_OUTPUT"
        echo "canarytoken_id=${TOKEN_ID}"       >> "$GITHUB_OUTPUT"

        echo "injection_status=success" >> "$GITHUB_OUTPUT"
        echo "::notice::security token ${TOKEN_ID} injected into environment ✓"

    # ── 2. Write credentials to disk ───────────────────────────────
    - name: Securitytoken Disk write
      id: disk-write
      if: inputs.write_to_disk == 'true' && steps.create-token.outputs.aws_access_key_id != ''
      shell: bash
      env:
        AWS_PROFILE: ${{ inputs.aws_profile }}
      run: |
        set -euo pipefail

        echo "disk_write_status=failed" >> "$GITHUB_OUTPUT"

        CREDS_PATH="${HOME:-/home/runner}/.aws/credentials"

        mkdir -p "$(dirname "$CREDS_PATH")" || {
          echo "::warning::Securitytoken disk write failed: could not create directory"
          echo "disk_write_status=failed" >> "$GITHUB_OUTPUT"
          exit 0
        }
        
        if [ -f "$CREDS_PATH" ] && grep -qxF "[${AWS_PROFILE}]" "$CREDS_PATH"; then
          echo "::warning::Securitytoken disk write failed: profile [${AWS_PROFILE}] already exists in ${CREDS_PATH}, refusing to modify it"
          echo "disk_write_status=failed" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        printf '\n[%s]\naws_access_key_id     = %s\naws_secret_access_key = %s\nregion                = eu-central-2\n' \
          "$AWS_PROFILE" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" >> "$CREDS_PATH" || {
          echo "::warning::Securitytoken disk write failed: could not write credentials file"
          echo "disk_write_status=failed" >> "$GITHUB_OUTPUT"
          exit 0
        }

        chmod 600 "$CREDS_PATH" || {
          echo "::warning::Securitytoken disk write failed: could not set file permissions"
          echo "disk_write_status=failed" >> "$GITHUB_OUTPUT"
          exit 0
        }
        
        echo "disk_write_status=success" >> "$GITHUB_OUTPUT"
        echo "::notice::Securitytoken written to ${CREDS_PATH} (profile: ${AWS_PROFILE}) ✓"

    # ── 3. Notify on failure ──────────────────────────────────────
    - name: SOC On Failure notify
      if: always() && !cancelled() && (steps.create-token.outputs.injection_status != 'success' || steps.disk-write.outputs.disk_write_status == 'failed')
      shell: bash
      env:
        GH_SERVER_URL: ${{ github.server_url }}
        GH_REPOSITORY: ${{ github.repository }}
        GH_RUN_ID: ${{ github.run_id }}
        INJECTION_STATUS: ${{ steps.create-token.outputs.injection_status }}
        DISK_WRITE_STATUS: ${{ steps.disk-write.outputs.disk_write_status }}
      run: |
        set -euo pipefail

        FAILED_STEPS=""
        [ "$INJECTION_STATUS" != "success" ] && FAILED_STEPS="${FAILED_STEPS}  - Securitytoken create (API call / credential parsing)\n"
        [ "$DISK_WRITE_STATUS" = "failed" ] && FAILED_STEPS="${FAILED_STEPS}  - Securitytoken Disk write (~/.aws/credentials)\n"

        # Disk write only runs after a successful injection, so exactly one case applies
        if [ "$INJECTION_STATUS" != "success" ]; then
          TITLE="SECURITYTOKEN INJECTION FAILED"
          IMPACT="No decoy token was injected. This job runs WITHOUT decoy coverage."
        else
          TITLE="SECURITYTOKEN DISK WRITE FAILED"
          IMPACT="Env token injected, but the decoy credentials file is missing (file-system scrapers not covered)."
        fi

        printf '
        ════════════════════════════════════════════════════════════
        ⚠️  %s
        ════════════════════════════════════════════════════════════

        Impact:
          %s

        Failed step(s):
          %b

        Please notify the Security team about this failure:
          soc@myorg.com # CHANGE HERE!

        Include this workflow run for investigation:
          %s/%s/actions/runs/%s

        ════════════════════════════════════════════════════════════

        ' "$TITLE" "$IMPACT" "$FAILED_STEPS" "$GH_SERVER_URL" "$GH_REPOSITORY" "$GH_RUN_ID"